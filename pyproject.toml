[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-image-optimizer"
version = "1.0.0"
description = "A privacy-first CLI that resizes images and converts them to metadata-free WebP."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_image_optimizer*"]
